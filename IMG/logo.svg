<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="80%">
    <stop offset="0%" stop-color="#122c49"/><stop offset="100%" stop-color="#081426"/>
  </radialGradient>
  <linearGradient id="cur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4fd8ff"/><stop offset="100%" stop-color="#2fd1b0"/>
  </linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<circle cx="512" cy="450" r="392" fill="none" stroke="#2f7fb8" stroke-width="7" opacity="0.85"/>
<circle cx="512" cy="450" r="378" fill="#0d2036" opacity="0.6"/>
<g stroke="#1f4468" stroke-width="2.5" fill="none" opacity="0.9">
  <circle cx="512" cy="450" r="254"/>
  <circle cx="512" cy="450" r="130"/>
  <line x1="512" y1="72" x2="512" y2="828"/>
  <line x1="134" y1="450" x2="890" y2="450"/>
  <line x1="245" y1="183" x2="779" y2="717"/>
  <line x1="779" y1="183" x2="245" y2="717"/>
</g>
<!-- masthead wind pennant -->
<g stroke="#0a1a2e" stroke-width="3">
  <line x1="512" y1="150" x2="512" y2="560" stroke="#0a1a2e" stroke-width="0"/>
</g>
<path d="M 512,150 L 555,165 L 512,180 Z" fill="#ff9f43" stroke="#081426" stroke-width="3"/>
<circle cx="512" cy="150" r="6" fill="#e8f1f8"/>
