<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="80%">
    <stop offset="0%" stop-color="#122c49"/><stop offset="100%" stop-color="#081426"/>
  </radialGradient>
  <linearGradient id="cur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4fd8ff"/><stop offset="100%" stop-color="#2fd1b0"/>
  </linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4a5b70"/><stop offset="100%" stop-color="#12171f"/>
  </linearGradient>
  <linearGradient id="dark2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#63788e"/><stop offset="100%" stop-color="#1a222c"/>
  </linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<circle cx="512" cy="450" r="392" fill="none" stroke="#2f7fb8" stroke-width="7" opacity="0.85"/>
<circle cx="512" cy="450" r="378" fill="#0d2036" opacity="0.6"/>
<g stroke="#1f4468" stroke-width="2.5" fill="none" opacity="0.9">
  <circle cx="512" cy="450" r="254"/>
  <circle cx="512" cy="450" r="130"/>
  <line x1="512" y1="72" x2="512" y2="828"/>
  <line x1="134" y1="450" x2="890" y2="450"/>
  <line x1="245" y1="183" x2="779" y2="717"/>
  <line x1="779" y1="183" x2="245" y2="717"/>
</g>

<!-- bow spray -->
<path d="M 336,558 C 316,548 300,552 286,540" fill="none" stroke="#bfeaff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
<path d="M 344,572 C 322,566 306,572 292,564" fill="none" stroke="#bfeaff" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

<!-- hull -->
<path d="M 356,558 C 400,600 624,600 668,558 C 662,544 402,544 356,558 Z" fill="#e8f1f8" stroke="#0a1a2e" stroke-width="4"/>
<rect x="500" y="551" width="24" height="14" fill="#0a1a2e"/>

<!-- masthead pennant -->
<path d="M 512,150 L 555,165 L 512,180 Z" fill="#ff9f43" stroke="#081426" stroke-width="3"/>
<circle cx="512" cy="150" r="6" fill="#e8f1f8"/>
<!-- mast -->
<line x1="512" y1="150" x2="512" y2="560" stroke="#0a1a2e" stroke-width="7" stroke-linecap="round"/>

<!-- outer headsail (genoa/jib) -->
<path d="M 500,232 C 460,320 400,430 360,520 L 472,548 Z" fill="url(#dark)" stroke="#6fc8e8" stroke-width="2" opacity="0.96"/>
<!-- inner headsail (self-tacking staysail) -->
<path d="M 512,320 C 484,370 452,430 424,486 L 500,548 Z" fill="url(#dark2)" stroke="#6fc8e8" stroke-width="2" opacity="0.96"/>

<!-- mainsail -->
<path d="M 512,205 C 560,260 598,405 610,542 L 512,556 Z" fill="url(#cur)" stroke="#0a1a2e" stroke-width="3"/>

<!-- toggle switches: which sail is set (double headsail on) -->
<g>
  <rect x="387" y="742" width="52" height="28" rx="14" fill="url(#cur)" stroke="#0a1a2e" stroke-width="2.5"/>
  <circle cx="426" cy="756" r="9" fill="#ffffff"/>
  <rect x="453" y="742" width="52" height="28" rx="14" fill="url(#cur)" stroke="#0a1a2e" stroke-width="2.5"/>
  <circle cx="492" cy="756" r="9" fill="#ffffff"/>
  <rect x="519" y="742" width="52" height="28" rx="14" fill="#16324f" stroke="#2f7fb8" stroke-width="2.5" opacity="0.85"/>
  <circle cx="532" cy="756" r="9" fill="#5c7f9c"/>
  <rect x="585" y="742" width="52" height="28" rx="14" fill="url(#cur)" stroke="#0a1a2e" stroke-width="2.5"/>
  <circle cx="624" cy="756" r="9" fill="#ffffff"/>
</g>
<g>
  <rect x="700" y="120" width="150" height="96" rx="22" fill="#0d2036" stroke="#2f7fb8" stroke-width="5"/>
  <text x="775" y="190" font-family="DejaVu Sans" font-weight="bold" font-size="62" fill="#4fd8ff" text-anchor="middle">SK</text>
</g>
<text x="512" y="922" font-family="DejaVu Sans" font-weight="bold" font-size="168" fill="#ffffff" text-anchor="middle">SAILS</text>
<text x="512" y="982" font-family="DejaVu Sans" font-weight="bold" font-size="44" fill="#2fd1b0" text-anchor="middle">S E T U P</text>
</svg>
