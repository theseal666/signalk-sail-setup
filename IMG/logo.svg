<path d="M 512,205 C 560,260 598,405 610,542 L 512,556 Z" fill="url(#cur)" stroke="#0a1a2e" stroke-width="3"/>
<!-- headsail glow + shape (forward of mast) -->
<path d="M 512,270 C 456,326 402,428 360,528 L 512,558 Z" fill="url(#cur)" opacity="0.18"/>
<path d="M 512,272 C 462,328 412,424 374,524 L 512,556 Z" fill="url(#cur)" stroke="#0a1a2e" stroke-width="3" opacity="0.9"/>
<!-- hull -->
<path d="M 356,558 C 400,600 624,600 668,558 C 662,544 402,544 356,558 Z" fill="#e8f1f8" stroke="#0a1a2e" stroke-width="4"/>
<rect x="500" y="552" width="24" height="14" fill="#0a1a2e"/>
<!-- toggle switches: which sail is set -->
<g>
  <rect x="387" y="742" width="52" height="28" rx="14" fill="url(#cur)" stroke="#0a1a2e" stroke-width="2.5"/>
  <circle cx="426" cy="756" r="9" fill="#ffffff"/>
  <rect x="453" y="742" width="52" height="28" rx="14" fill="#16324f" stroke="#2f7fb8" stroke-width="2.5" opacity="0.85"/>
  <circle cx="466" cy="756" r="9" fill="#5c7f9c"/>
  <rect x="519" y="742" width="52" height="28" rx="14" fill="url(#cur)" stroke="#0a1a2e" stroke-width="2.5"/>
  <circle cx="558" cy="756" r="9" fill="#ffffff"/>
  <rect x="585" y="742" width="52" height="28" rx="14" fill="#16324f" stroke="#2f7fb8" stroke-width="2.5" opacity="0.85"/>
  <circle cx="598" cy="756" r="9" fill="#5c7f9c"/>
</g>
<g>
  <rect x="700" y="120" width="150" height="96" rx="22" fill="#0d2036" stroke="#2f7fb8" stroke-width="5"/>
