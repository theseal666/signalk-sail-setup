<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sail Setup</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:10px}
#hd{display:flex;align-items:center;gap:10px;padding-bottom:6px}
#hd img{width:36px;height:36px;border-radius:8px}
#hd span{font-size:18px;font-weight:bold;letter-spacing:1px;color:#e6edf3}
h2{margin:12px 0 6px 0;font-size:16px;color:#79c0ff;text-transform:uppercase;letter-spacing:1px}
.g{overflow:hidden}
.g button{float:left;width:31%;margin:1%;height:70px;font-size:22px;border:1px solid #30363d;
 border-radius:10px;background:#21262d;color:#e6edf3}
.g button.on{background:#1a7f37;border-color:#2ea043;font-weight:bold}
.g button:active{opacity:0.7}
/* Reef states sit under their group's sails: shorter, amber when in, so one glance
   separates "which sail" from "how deep it's reefed". Dimmed until a sail is up. */
.g.st button{height:48px;font-size:18px}
.g.st button.on{background:#9e6a03;border-color:#d29922;color:#fff}
.g.st button.dis{opacity:0.3}
#cur{padding:8px 2px;font-size:15px;color:#e6edf3;border-bottom:1px solid #30363d;margin-bottom:6px}
#cur b{color:#79c0ff}
#hrs{clear:both;margin-top:16px;border-top:1px solid #30363d;padding-top:8px}
#hrs table{border-collapse:collapse;width:100%;font-size:13px}
#hrs td{padding:3px 6px;color:#8b949e}
#hrs td.n{color:#e6edf3;text-align:left}
#hrs td.h{color:#79c0ff;text-align:right;font-weight:bold;white-space:nowrap}
#hrs td.s{color:#6e7681;text-align:right;white-space:nowrap}
#st{clear:both;padding-top:14px;color:#8b949e;font-size:14px}
</style>
</head>
<body>
<div id="hd"><img src="icon.png" alt="Sail Setup"><span>SAIL SETUP</span></div>
<div id="cur">loading...</div>
<div id="app"></div>
<div id="hrs"></div>
<div id="st"></div>
<script type="text/javascript">
var BASE='/plugins/signalk-sail-setup';
function xhr(url,cb){var r=new XMLHttpRequest();r.open('GET',url,true);
 r.onreadystatechange=function(){if(r.readyState===4)cb(r.status,r.responseText)};r.send();}
var groupOrder=[];
var groupDefs={};
var cur={};      // group -> sail up
var reefs={};    // group -> reef level, 0 = unreefed
var lastHours={};
function showSet(set){
 document.getElementById('cur').innerHTML='Current rig: <b>'+(set&&set.length?set.join(', '):'none')+'</b>';
}
function fmtH(h){return (h==null?0:h).toFixed(1)+'h';}
function showHours(){
 if(!lastHours){document.getElementById('hrs').innerHTML='';return;}
 var rows='';
 for(var i=0;i<groupOrder.length;i++){var g=groupOrder[i];var h=lastHours[g]||{totalHours:0,bySailHours:{}};
  var bySail=[];
  for(var s in h.bySailHours){if(h.bySailHours.hasOwnProperty(s)&&h.bySailHours[s]>0)bySail.push(s+' '+fmtH(h.bySailHours[s]));}
  rows+='<tr><td class="n">'+g+'</td><td class="h">'+fmtH(h.totalHours)+'</td><td class="s">'+bySail.join(', ')+'</td></tr>';}
 document.getElementById('hrs').innerHTML='<table>'+rows+'</table>';
}
// Rendered from the local model rather than by poking classNames on the clicked element:
// a reef tap changes nothing about which sail button is lit and vice versa, and the reef
// row highlights cumulatively, so it's simpler to redraw the group than to patch it.
function renderGroup(g){
 var grp=groupDefs[g];
 var h='';
 for(var j=0;j<grp.sails.length;j++){var s=grp.sails[j];
  h+='<button class="'+(cur[g]===s?'on':'')+'" onclick="tap(\''+g+'\',\''+s+'\')">'+s+'</button>';}
 document.getElementById('g_'+g).innerHTML=h;
 if(!grp.states||!grp.states.length)return;
 var hs='';
 for(var k=0;k<grp.states.length;k++){var st=grp.states[k];
  // Every reef up to the current level lights up: two reefs in shows both buttons amber.
  var on=cur[g]&&(reefs[g]||0)>=k+1;
  hs+='<button class="'+(on?'on':(cur[g]?'':'dis'))+'" onclick="tapState(\''+g+'\',\''+st+'\')">'+st+'</button>';}
 document.getElementById('s_'+g).innerHTML=hs;
}
function build(data){
 var html='';
 groupOrder=[];
 for(var i=0;i<data.groups.length;i++){var g=data.groups[i];
  groupOrder.push(g.name);
  groupDefs[g.name]=g;
  html+='<h2>'+g.name+'</h2><div class="g" id="g_'+g.name+'"></div>';
  if(g.states&&g.states.length)html+='<div class="g st" id="s_'+g.name+'"></div>';}
 document.getElementById('app').innerHTML=html;
 cur=data.current||{};
 reefs=data.reefs||{};
 for(var k=0;k<groupOrder.length;k++)renderGroup(groupOrder[k]);
 showSet(data.set);
 lastHours=data.hours||null;
 showHours();
}
function declare(g,qs){
 xhr(BASE+'/declare?group='+encodeURIComponent(g)+qs,function(code,txt){
  if(code===200){
   var r=JSON.parse(txt);
   cur[g]=r.current;
   reefs[g]=r.reef;
   renderGroup(g);
   showSet(r.set);
   if(r.hours){if(!lastHours)lastHours={};lastHours[g]=r.hours;}else{lastHours=null;}
   showHours();
   document.getElementById('st').innerHTML=g+' = '+(r.label||'cleared')+' logged '+new Date().toUTCString();
  }else{document.getElementById('st').innerHTML='error: '+txt;}
 });
}
function tap(g,v){declare(g,'&sail='+encodeURIComponent(v));}
function tapState(g,st){
 // A reef is a state of a sail, so there has to be one up first - say so instead of
 // firing a request the plugin will refuse.
 if(!cur[g]){document.getElementById('st').innerHTML='set a '+g+' first, then reef it';return;}
 declare(g,'&state='+encodeURIComponent(st));
}
xhr(BASE+'/setup',function(st,txt){
 if(st===200){build(JSON.parse(txt));}
 else{document.getElementById('st').innerHTML='cannot load config ('+st+')';}
});
</script>
</body>
</html>
